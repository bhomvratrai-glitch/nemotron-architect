[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nemotron-architect"
version = "1.0.0"
description = "Autonomous Self-Healing AI Software Engineer powered by NVIDIA Nemotron & Nebius Token Factory"
readme = "README.md"
authors = [{ name = "Bhomvrat Rai", email = "bhomvratrai@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
nemotron-architect = "nemotron_architect.cli:main"
